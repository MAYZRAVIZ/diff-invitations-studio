name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNG icons and stage site
        run: |
          chmod +x decode-icons.sh
          ./decode-icons.sh
          mkdir -p _site
          cp index.html styles.css app.js sw.js manifest.json README.md .nojekyll _site/ 2>/dev/null || true
          cp index.html styles.css app.js sw.js manifest.json README.md _site/
          touch _site/.nojekyll
          cp logo.svg icon-192.svg icon-512.svg _site/
          cp icon-192.png icon-512.png apple-touch-icon.png favicon-32.png favicon.ico _site/
          ls -la _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
